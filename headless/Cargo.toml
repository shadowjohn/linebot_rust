[package]
name = "linebot_headless"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
fs2 = "0.4"
line-rs = { git = "https://github.com/shadowjohn/line-rs.git", rev = "884203cb747193d83b476460a7a3a5e611f197bb" }
linebot_rust = { path = ".." }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
